services:
  - type: web
    name: farmguard-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: MQTT_BROKER
        value: ""
      - key: MQTT_PORT
        value: "1883"
      - key: MQTT_USERNAME
        value: ""
      - key: MQTT_PASSWORD
        value: ""
      - key: MINIO_ENDPOINT
        value: ""
      - key: MINIO_ACCESS_KEY
        value: ""
      - key: MINIO_SECRET_KEY
        value: ""
      - key: MINIO_BUCKET
        value: alert-snapshots
      - key: MINIO_SECURE
        value: "false"
      - key: FIREBASE_CREDENTIALS_PATH
        value: ""
      - key: CORS_ORIGINS
        value: ""
      - key: PYTHON_VERSION
        value: "3.11.12"
