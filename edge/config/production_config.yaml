# Anti-Theft Smart System — Production Configuration
# Copy this to device_config.yaml on the Orange Pi and fill in your values.

mode: "production"

device:
  device_id: "FARM-001"          # Unique ID for this device
  farm_id: "farm_1"              # Must match farm created in mobile app

camera:
  production:
    cam1_source: "/dev/video0"   # Front camera (primary entry point)
    cam2_source: "/dev/video2"   # Rear camera (optional — comment out for single cam)

mqtt:
  broker: "YOUR_VPS_IP"         # Replace with your server IP or domain
  port: 8883                     # TLS port
  username: "FARM-001"           # From mosquitto/credentials/FARM-001.env
  password: "CHANGE_ME"          # From mosquitto/credentials/FARM-001.env
  tls_enabled: true
  ca_cert: "/opt/surveillance/certs/ca.crt"   # Copy from server
  client_cert: ""
  client_key: ""

detection:
  backend: "tflite"              # tflite recommended for Pi 3 (ARMv7)
  model_path: "models/yolov5n.tflite"
  input_size: 320                # 320 for Pi 3 (~500ms), 640 for aarch64 (~300ms)
  confidence_threshold: 0.55     # Lower than sim — real scenes are harder
  nms_threshold: 0.45
  temporal_frames: 2             # Require 2 consecutive frames to confirm
  cooldown_seconds: 60           # 1 min between alerts from same camera
  min_motion_area: 800           # Higher for outdoor (wind, leaves)

schedule:
  enabled: true
  start_hour: 18                 # 6 PM — surveillance starts at dusk
  end_hour: 7                    # 7 AM — stops at dawn

exclusion_zones: {}
  # Add after install — mark areas with constant motion (trees, roads):
  # cam_front:
  #   - { x: 0, y: 350, w: 640, h: 130, label: "road_at_bottom" }

gpio:
  tamper_pin: 17
  mains_detect_pin: 27

# No simulation section needed in production
