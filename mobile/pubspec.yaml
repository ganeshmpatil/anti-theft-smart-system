name: farm_guard
description: "AI-powered anti-theft surveillance for agricultural farms."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.0.7
  web_socket_channel: ^3.0.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/alarm_tone.wav
